# Atualiza o painel da carteira MZR todo dia, nos servidores do GitHub (sem depender de computador ligado).
# Coleta só fontes públicas (BCB, FRED, CVM e Tesouro Direto), recalcula carteira, régua e índices, refaz o
# index.html e publica. Os arquivos baixados ficam em cache entre as execuções; só o mês corrente e o anterior
# da CVM são baixados de novo a cada dia.
name: Atualizar painel

on:
  schedule:
    # 27/11/2026: o GitHub chegou a atrasar 6 a 9 horas as rodadas marcadas em hora cheia. Minutos quebrados atrasam
    # menos, e as reservas garantem a rodada do dia; rodar a mais não estraga nada (só publica se algo mudou).
    - cron: '7 21 * * *'     # 18:07 em Brasília: a principal, depois do fechamento do mercado
    - cron: '37 22 * * *'    # 19:37: reserva (FRED, Tesouro e a ponte do dia, se chegarem depois)
    - cron: '13 1 * * *'     # 22:13: reserva
    - cron: '23 5 * * *'     # 02:23: logo depois do arquivo noturno da CVM (cotas do dia útil anterior)
    - cron: '43 9 * * *'     # 06:43: reserva da madrugada
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperar os dados brutos já baixados
        uses: actions/cache@v4
        with:
          path: dados-brutos
          key: brutos-${{ github.run_id }}
          restore-keys: brutos-

      - name: Coletar e calcular
        run: python -I -X utf8 coletor/atualizar.py .

      - name: Gerar a página
        run: python -I -X utf8 coletor/site_estatico.py . .

      - name: Gerar o PDF da página (plano B para a apresentação)
        continue-on-error: true
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,1800             --virtual-time-budget=20000 --no-pdf-header-footer --print-to-pdf=painel.pdf "file://$PWD/index.html?pdf=1"

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll dados
          [ -f painel.pdf ] && git add painel.pdf
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            ULTIMO=$(python -c "import json;print(json.load(open('dados/serie.json',encoding='utf-8'))['rows'][-1]['data'])")
            git commit -m "Dados até ${ULTIMO} (atualização automática)"
            git push
          fi
